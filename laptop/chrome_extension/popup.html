<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GestureControl TV</title>
    <style>
        body {
            width: 270px;
            margin: 0;
            padding: 16px;
            font-family: Arial, sans-serif;
            color: #222;
        }

        h2 {
            margin: 0 0 5px;
            font-size: 19px;
        }

        .subtitle {
            color: #777;
            font-size: 12px;
            margin-bottom: 16px;
        }

        .site-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 0;
            border-top: 1px solid #eee;
            border-bottom: 1px solid #eee;
        }

        #status-text {
            font-size: 13px;
            font-weight: bold;
        }

        #domain-name {
            margin-top: 4px;
            font-size: 11px;
            color: #777;
            word-break: break-all;
        }

        .switch {
            position: relative;
            display: inline-block;
            flex-shrink: 0;
            width: 36px;
            height: 21px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            inset: 0;
            background: #ccc;
            border-radius: 21px;
            cursor: pointer;
        }

        .slider::before {
            content: "";
            position: absolute;
            width: 15px;
            height: 15px;
            top: 3px;
            left: 3px;
            background: white;
            border-radius: 50%;
            transition: transform 0.2s;
        }

        input:checked + .slider {
            background: #4CAF50;
        }

        input:checked + .slider::before {
            transform: translateX(15px);
        }

        input:focus-visible + .slider {
            outline: 2px solid #222;
            outline-offset: 2px;
        }

        .section-title {
            margin: 16px 0 10px;
            font-size: 13px;
            font-weight: bold;
        }

        .control {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            font-size: 12px;
        }

        .control span:first-child {
            color: #777;
        }

        footer {
            margin-top: 16px;
            padding-top: 10px;
            border-top: 1px solid #eee;
            text-align: center;
            font-size: 10px;
            color: #888;
        }

        footer a {
            color: #555;
        }
    </style>
</head>
<body>
    <h2>GestureControl TV</h2>

    <div class="subtitle">
        Directional browser navigation
    </div>

    <div class="site-row">
        <div>
            <div id="status-text">
                Checking site...
            </div>
            <div id="domain-name">...</div>
        </div>

        <label class="switch">
            <input
                type="checkbox"
                id="enable-toggle"
                aria-label="Enable navigation on this site"
                disabled
            >
            <span class="slider"></span>
        </label>
    </div>

    <div class="section-title">Controls</div>

    <div class="control">
        <span>Arrow keys</span>
        <span>Navigate</span>
    </div>

    <div class="control">
        <span>Enter</span>
        <span>Select / Type</span>
    </div>

    <div class="control">
        <span>Virtual keyboard</span>
        <span>Search / Close</span>
    </div>

    <footer>
        Based on
        <a href="https://github.com/SeeSharpSoft/couch-browser"
           target="_blank" rel="noopener noreferrer">
            Couch Browser
        </a>
        · v<span id="extension-version"></span>
    </footer>

    <script src="popup.js"></script>
</body>
</html>
