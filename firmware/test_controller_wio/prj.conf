# Trackball input
CONFIG_GPIO=y
CONFIG_PWM=y
CONFIG_INPUT=y
CONFIG_INPUT_GPIO_KEYS=y

# Logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_MODE_DEFERRED=y

# BLE central for nRF receiver
CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_GATT_CLIENT=y

# BLE peripheral for Gemma host
CONFIG_BT_PERIPHERAL=y

# Only one active BLE connection at a time
CONFIG_BT_MAX_CONN=1

CONFIG_BT_DEVICE_NAME="GestureGemma"