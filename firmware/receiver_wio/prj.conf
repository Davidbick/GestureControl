# GPIO
CONFIG_GPIO=y

# Logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# Bluetooth Peripheral
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="MyoRx"
CONFIG_BT_MAX_CONN=1

# Wio OLED
CONFIG_DISPLAY=y
CONFIG_CHARACTER_FRAMEBUFFER=y
CONFIG_I2C=y
CONFIG_SSD1306=y

# OLED framebuffer memory
CONFIG_HEAP_MEM_POOL_SIZE=16384
