CONFIG_GPIO=y

# Zephyr logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_MODE_DEFERRED=y

# IMU
CONFIG_SENSOR=y
CONFIG_I2C=y
CONFIG_REGULATOR=y
CONFIG_LSM6DSL=y

CONFIG_ADC=y

# BLE Central
CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_MAX_CONN=1

# USB CDC serial recording
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
CONFIG_PRINTK=y

# Keep high-rate sample output out of deferred logging.
CONFIG_LOG_PRINTK=n
